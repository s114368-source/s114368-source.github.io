<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貓咪蛋糕暴走擴大中 🐱🍰</title>
    <style>
        body {
            background-color: #fff0f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* 防止貓咪變太大時出現捲軸 */
            position: relative;
        }

        /* 標題與 UI 層級調高，確保不被變大的貓咪完全擋住 */
        h1 {
            color: #d2691e;
            margin-bottom: 5px;
            z-index: 10;
            background-color: rgba(255, 240, 245, 0.8);
            padding: 5px 15px;
            border-radius: 10px;
        }

        .status-text {
            font-size: 20px;
            color: #555;
            font-weight: bold;
            z-index: 10;
            background-color: rgba(255, 240, 245, 0.8);
            padding: 5px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* 貓咪本體：使用 fixed 置中，並加上平滑的變大動畫 */
        .cat {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px; /* 初始大小 */
            transition: font-size 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            z-index: 1;
        }

        /* 按鈕固定在最下方，且 z-index 很高 */
        .feed-btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 22px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            transition: all 0.2s;
            font-weight: bold;
            z-index: 10;
        }

        .feed-btn:hover {
            background-color: #ff1493;
            transform: translateX(-50%) translateY(-2px);
        }

        .feed-btn:active {
            transform: translateX(-50%) translateY(1px);
        }

        /* 蛋糕碎屑/愛心特效 */
        .effect {
            position: absolute;
            font-size: 30px;
            animation: explode 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes explode {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <h1 id="title">🐱 貓咪蛋糕大胃王 🍰</h1>
    <div class="status-text" id="status">貓咪肚子餓了，想吃蛋糕！</div>

    <!-- 貓咪一開始是想吃的表情 -->
    <div class="cat" id="cat">😋</div>

    <button class="feed-btn" id="feedBtn" onclick="feedCake()">🍰 給貓咪吃蛋糕！</button>

    <script>
        let catSize = 80; // 初始大小 (px)
        const maxSize = 800; // 填滿畫面的目標大小 (當寬度或高度達到這個尺寸視為填滿)
        let cakeCount = 0;
        
        const catElement = document.getElementById('cat');
        const statusText = document.getElementById('status');
        const feedBtn = document.getElementById('feedBtn');
        const titleElement = document.getElementById('title');

        function feedCake() {
            // 如果已經到最大體積，就限制不再放大
            if (catSize >= maxSize) return;

            cakeCount++;
            
            // 每次點擊，貓咪尺寸變大 40px
            catSize += 40;
            catElement.style.fontSize = catSize + 'px';

            // 根據吃了多少蛋糕改變表情與台詞
            if (catSize < 300) {
                catElement.innerText = '😸';
                statusText.innerText = `貓咪吃了 ${cakeCount} 個蛋糕，還想再吃！`;
            } else if (catSize < 550) {
                catElement.innerText = '🦁';
                statusText.innerText = `等一下... 牠是不是變太大隻了？！(蛋糕數: ${cakeCount})`;
            } else if (catSize < maxSize) {
                catElement.innerText = '🐯';
                statusText.innerText = `Σ(ﾟдﾟ) 救命！房間快要裝不下牠了！(蛋糕數: ${cakeCount})`;
            } else {
                // 滿版狀態
                catElement.innerText = '🙀';
                titleElement.innerText = '👑 貓咪統治了世界';
                statusText.innerText = `🎉 碰！貓咪吃了 ${cakeCount} 個蛋糕，已經徹底填滿了整個畫面！`;
                feedBtn.innerText = '再養一隻突變貓';
                feedBtn.setAttribute('onclick', 'resetGame()');
            }

            // 觸發爆炸蛋糕特效
            createExplosionEffect();
        }

        function createExplosionEffect() {
            // 隨機產生蛋糕碎屑或愛心
            const items = ['🍰', '✨', '❤️', '🧁'];
            
            for (let i = 0; i < 6; i++) {
                const effect = document.createElement('div');
                effect.classList.add('effect');
                effect.innerText = items[Math.floor(Math.random() * items.length)];
                
                // 置中定位
                effect.style.left = '50%';
                effect.style.top = '50%';
                
                // 隨機計算爆炸散射的方向 (X 與 Y 軸的位移)
                const randomX = (Math.random() - 0.5) * 300 + 'px';
                const randomY = (Math.random() - 0.5) * 300 + 'px';
                effect.style.setProperty('--x', randomX);
                effect.style.setProperty('--y', randomY);
                
                document.body.appendChild(effect);

                // 動畫結束後移除
                setTimeout(() => {
                    effect.remove();
                }, 600);
            }
        }

        function resetGame() {
            catSize = 80;
            cakeCount = 0;
            catElement.style.fontSize = catSize + 'px';
            catElement.innerText = '😋';
            titleElement.innerText = '🐱 貓咪蛋糕大胃王 🍰';
            statusText.innerText = '貓咪肚子餓了，想吃蛋糕！';
            feedBtn.innerText = '🍰 給貓咪吃蛋糕！';
            feedBtn.setAttribute('onclick', 'feedCake()');
        }
    </script>
</body>
</html>
