<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圓滾滾貓咪蛋糕暴走中 🐱🍰</title>
    <style>
        body {
            background-color: #fff0f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        h1 {
            color: #d2691e;
            margin-bottom: 5px;
            z-index: 10;
            background-color: rgba(255, 240, 245, 0.8);
            padding: 5px 15px;
            border-radius: 10px;
        }

        .status-text {
            font-size: 20px;
            color: #555;
            font-weight: bold;
            z-index: 10;
            background-color: rgba(255, 240, 245, 0.8);
            padding: 5px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* ================= 圓滾滾貓咪的 CSS 結構 ================= */
        .cat-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1); /* 透過 JS 控制 scale 來等比例變大 */
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2) ;
            z-index: 1;
            width: 200px;
            height: 200px;
        }

        /* 貓咪大身體（圓滾滾的核心） */
        .cat-body {
            width: 200px;
            height: 180px;
            background-color: #fca441; /* 經典橘貓色 */
            border-radius: 50% 50% 45% 45%; /* 營造底部沉甸甸的肥胖感 */
            position: absolute;
            bottom: 0;
            box-shadow: inset -10px -10px 0px rgba(0,0,0,0.05);
        }

        /* 白白胖胖的肚子 */
        .cat-belly {
            width: 120px;
            height: 90px;
            background-color: #ffffff;
            border-radius: 50%;
            position: absolute;
            bottom: 10px;
            left: 40px;
        }

        /* 貓耳朵 */
        .ear {
            width: 45px;
            height: 45px;
            background-color: #fca441;
            position: absolute;
            top: -10px;
            border-radius: 30% 70% 30% 70% / 30% 30% 70% 70%;
        }
        .ear.left { left: 25px; transform: rotate(-15deg); }
        .ear.right { right: 25px; transform: rotate(60deg); }

        /* 水汪汪大眼睛 */
        .eye {
            width: 22px;
            height: 22px;
            background-color: #2c3e50;
            border-radius: 50%;
            position: absolute;
            top: 55px;
        }
        .eye.left { left: 50px; }
        .eye.right { right: 50px; }
        /* 眼中高光 */
        .eye::after {
            content: '';
            width: 7px;
            height: 7px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 4px;
        }

        /* 腮紅 */
        .blush {
            width: 20px;
            height: 10px;
            background-color: #ff9a9e;
            border-radius: 50%;
            position: absolute;
            top: 78px;
            opacity: 0.6;
        }
        .blush.left { left: 35px; }
        .blush.right { right: 35px; }

        /* 貓咪小嘴巴 */
        .mouth {
            width: 16px;
            height: 8px;
            border: 3px solid #2c3e50;
            border-top: none;
            border-radius: 0 0 10px 10px;
            position: absolute;
            top: 75px;
            left: 92px;
        }

        /* 貓尾巴 */
        .tail {
            width: 30px;
            height: 80px;
            background-color: #d98226;
            position: absolute;
            bottom: 20px;
            right: -15px;
            border-radius: 15px;
            transform: rotate(25deg);
            z-index: -1;
            transform-origin: bottom center;
            animation: wag 1.5s ease-in-out infinite alternate;
        }

        @keyframes wag {
            0% { transform: rotate(15deg); }
            100% { transform: rotate(35deg); }
        }

        /* 皇冠（通關時出現） */
        .crown {
            font-size: 40px;
            position: absolute;
            top: -45px;
            left: 80px;
            display: none;
            z-index: 5;
        }

        /* ================= UI 與特效 ================= */
        .feed-btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 22px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            transition: all 0.2s;
            font-weight: bold;
            z-index: 10;
        }

        .feed-btn:hover {
            background-color: #ff1493;
            transform: translateX(-50%) translateY(-2px);
        }

        .feed-btn:active {
            transform: translateX(-50%) translateY(1px);
        }

        .effect {
            position: absolute;
            font-size: 30px;
            animation: explode 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1 id="title">🐱 圓滾滾橘貓大胃王 🍰</h1>
    <div class="status-text" id="status">貓咪肚子餓了，想吃蛋糕！</div>

    <div class="cat-wrapper" id="cat">
        <div class="crown" id="crown">👑</div>
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="cat-body">
            <div class="cat-belly"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="blush left"></div>
            <div class="blush right"></div>
            <div class="mouth"></div>
        </div>
        <div class="tail"></div>
    </div>

    <button class="feed-btn" id="feedBtn" onclick="feedCake()">🍰 給貓咪吃蛋糕！</button>

    <script>
        let catScale = 1.0;     // 初始縮放倍率
        const maxScale = 5.0;    // 放大到 5 倍時視為填滿畫面
        let cakeCount = 0;
        
        const catElement = document.getElementById('cat');
        const crownElement = document.getElementById('crown');
        const statusText = document.getElementById('status');
        const feedBtn = document.getElementById('feedBtn');
        const titleElement = document.getElementById('title');

        function feedCake() {
            if (catScale >= maxScale) return;

            cakeCount++;
            
            // 每次點擊蛋糕，貓咪等比例放大 0.4 倍
            catScale += 0.4;
            catElement.style.transform = `translate(-50%, -50%) scale(${catScale})`;

            // 根據縮放狀態更新文字與劇情
            if (catScale < 2.5) {
                statusText.innerText = `貓咪吃了 ${cakeCount} 個蛋糕，身體變得更圓了！`;
            } else if (catScale < 4.0) {
                statusText.innerText = `哇！這隻橘貓已經圓成一粒大火球了！(蛋糕數: ${cakeCount})`;
            } else if (catScale < maxScale) {
                statusText.innerText = `Σ(ﾟдﾟ) 螢幕快要塞不下這隻终極大肥貓了！(蛋糕數: ${cakeCount})`;
            } else {
                // 滿版狀態
                crownElement.style.display = 'block'; // 戴上皇冠
                titleElement.innerText = '👑 橘貓國王統治了世界';
                statusText.innerText = `🎉 碰！吃了 ${cakeCount} 個蛋糕，圓滾滾的橘貓成功填滿了畫面，成為世界之王！`;
                feedBtn.innerText = '重新認養一隻小橘貓';
                feedBtn.setAttribute('onclick', 'resetGame()');
            }

            createExplosionEffect();
        }

        function createExplosionEffect() {
            const items = ['🍰', '✨', '❤️', '🧁'];
            for (let i = 0; i < 6; i++) {
                const effect = document.createElement('div');
                effect.classList.add('effect');
                effect.innerText = items[Math.floor(Math.random() * items.length)];
                
                effect.style.left = '50%';
                effect.style.top = '50%';
                
                const randomX = (Math.random() - 0.5) * 400 + 'px';
                const randomY = (Math.random() - 0.5) * 400 + 'px';
                effect.style.setProperty('--x', randomX);
                effect.style.setProperty('--y', randomY);
                
                document.body.appendChild(effect);
                setTimeout(() => { effect.remove(); }, 600);
            }
        }

        function resetGame() {
            catScale = 1.0;
            cakeCount = 0;
            catElement.style.transform = `translate(-50%, -50%) scale(${catScale})`;
            crownElement.style.display = 'none';
            titleElement.innerText = '🐱 圓滾滾橘貓大胃王 🍰';
            statusText.innerText = '貓咪肚子餓了，想吃蛋糕！';
            feedBtn.innerText = '🍰 給貓咪吃蛋糕！';
            feedBtn.setAttribute('onclick', 'feedCake()');
        }
    </script>
</body>
</html>
