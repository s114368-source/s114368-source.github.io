<!DOCTYPE html>
<html lang="zh-TW">
<head>

        body {
            background-color: #f5f6fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 取名字與歡迎 UI */
        #ui-header {
            text-align: center;
            z-index: 100;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: opacity 0.5s, visibility 0.5s;
            max-width: 400px;
            width: 80%;
        }

        h1 {
            color: #d2691e;
            margin-top: 0;
            font-size: 24px;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px 20px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 2px solid #ff69b4;
            border-radius: 25px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        #startBtn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
            font-weight: bold;
            transition: transform 0.2s;
        }
        #startBtn:hover { transform: scale(1.05); }

        /* 頂部貓咪名字顯示 */
        #status-display {

            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            color: #333;
            font-weight: bold;

            padding: 8px 25px;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: none;
