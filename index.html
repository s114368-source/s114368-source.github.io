<html lang="zh-TW">
<head>

    <title>長頸鹿大草原覓食記 - Giraffe Snake</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .game-container { background: #faf4e8; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(74, 55, 40, 0.15); text-align: center; max-width: 460px; width: 100%; border: 5px solid #debc85; }
        h1 { font-size: 24px; margin-bottom: 15px; color: #6b4c1b; }
        .score-board { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 16px; font-weight: bold; background-color: #f0e2cc; padding: 10px 15px; border-radius: 10px; }
        #gameCanvas { background-color: #aad46e; border: 4px solid #8cb847; border-radius: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); display: block; margin: 0 auto; }
        .controls-info { margin-top: 15px; font-size: 13px; color: #7a634e; line-height: 1.6; }
        .controls-info span { background: #debc85; padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; }
        #restartBtn { margin-top: 15px; padding: 10px 25px; font-size: 16px; font-weight: bold; color: white; background-color: #d97706; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        #restartBtn:hover { background-color: #b45309; }
    </style>
</head>
