<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎣 HTML5 Fishing Game</title>
    <style>
        body {
            background-color: #a8dadc;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            background-color: #f1faee;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin: 0 0 10px 0;
            color: #1d3557;
        }

        #score-board {
            font-size: 24px;
            font-weight: bold;
            color: #e63946;
            margin-bottom: 15px;
        }

        #game-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        /* 釣魚主量條 */
        #fishing-bar {
            width: 50px;
            height: 380px;
            background-color: #457b9d;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        /* 橘色浮標 */
        #bobber {
            width: 100%;
            height: 80px;
            background-color: #f4a261;
            position: absolute;
            left: 0;
            bottom: 0;
            transition: bottom 0.05s linear;
            border-radius: 4px;
        }

        /* 綠色的魚 */
        #fish {
            width: 40px;
            height: 30px;
            background-color: #2a9d8f;
            position: absolute;
            left: 5px;
            bottom: 150px;
            transition: bottom 0.1s ease-in-out;
            border-radius: 5px;
        }

        /* 金色進度條外框 */
        #progress-container {
            width: 20px;
            height: 380px;
            background-color: #dbd3d3;
            border-radius: 5px;
            position: relative;
            display: flex;
            align-items: flex-end;
        }

        /* 金色進度條本體 */
        #progress-bar {
            width: 100%;
            height: 50%;
            background-color: #e9c46a;
            border-radius: 5px;
            transition: height 0.05s linear;
        }

        #msg {
            font-size: 18px;
            height: 25px;
            color: #1d3557;
            margin-bottom: 15px;
        }

        /* 手機版按鈕，電腦版也可以用點擊的 */
        #action-btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #e63946;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #action-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h2>🎣 Mini Fishing Game</h2>
        <div id="score-board">BEST: <span id="best-score">0</span> cm</div>
        
        <div id="game-stage">
            <div id="fishing-bar">
                <div id="bobber"></div>
                <div id="fish"></div>
            </div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>

        <div id="msg">Hold [SPACE] or PRESS BUTTON to fish!</div>
        <button id="action-btn">HOLD TO LIFT</button>
    </div>
