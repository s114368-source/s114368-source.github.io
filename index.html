<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長頸鹿大草原覓食記 - Giraffe Snake</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); background-color: #f7e7ce; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #4a3728; }
        .game-container { background: #faf4e8; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(74, 55, 40, 0.15); text-align: center; max-width: 460px; width: 100%; border: 5px solid #debc85; }
        h1 { font-size: 24px; margin-bottom: 15px; color: #6b4c1b; }
        .score-board { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 16px; font-weight: bold; background-color: #f0e2cc; padding: 10px 15px; border-radius: 10px; }
        #gameCanvas { background-color: #aad46e; border: 4px solid #8cb847; border-radius: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); display: block; margin: 0 auto; }
        .controls-info { margin-top: 15px; font-size: 13px; color: #7a634e; line-height: 1.6; }
        .controls-info span { background: #debc85; padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; }
        #restartBtn { margin-top: 15px; padding: 10px 25px; font-size: 16px; font-weight: bold; color: white; background-color: #d97706; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        #restartBtn:hover { background-color: #b45309; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🦒 長頸鹿大草原覓食記 🍃</h1>
        <div class="score-board">
            <span>吃到的樹葉：<span id="score">0</span> 叢</span>
            <span>最高紀錄：<span id="high-score">0</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls-info">
            <p>⌨️ 使用鍵盤方向鍵 <span>↑</span> <span>↓</span> <span>←</span> <span>→</span> 控制長頸鹿移動</p>
            <p>避免撞到牆壁或自己的長脖子！</p>
        </div>
        <button id="restartBtn" style="display: none;">重新開始</button>
    </div>

    <script>
        window.onload = function() {
            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");
            const scoreEl = document.getElementById("score");
            const highScoreEl = document.getElementById("high-score");
            const restartBtn = document.getElementById("restartBtn");

            const gridSize = 20;
            const tileCount = canvas.width / gridSize;

            let snake = [];
            let food = { x: 0, y: 0 };
            let dx = gridSize;
            let dy = 0;
            let score = 0;
            let highScore = localStorage.getItem("giraffe_high_score") || 0;
            let gameInterval;
            const gameSpeed = 150; 
            let gameActive = true;

            highScoreEl.innerText = highScore;

            function startGame() {
                // 修正初始位置，離邊界遠一點，絕對不會開局撞牆
                snake = [
                    { x: 7 * gridSize, y: 10 * gridSize },
                    { x: 6 * gridSize, y: 10 * gridSize },
                    { x: 5 * gridSize, y: 10 * gridSize }
                ];
                dx = gridSize; 
                dy = 0; 
                score = 0;
                scoreEl.innerText = score;
                gameActive = true;
                restartBtn.style.display = "none";
                generateFood();
                
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(update, gameSpeed);
                draw(); 
            }

            function generateFood() {
                food.x = Math.floor(Math.random() * tileCount) * gridSize;
                food.y = Math.floor(Math.random() * tileCount) * gridSize;
                
                // 確保食物不會生在長頸鹿身上
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        generateFood();
                        break;
                    }
                }
            }

            window.addEventListener("keydown", changeDirection);

            function changeDirection(event) {
                if (!gameActive) return;
                const keyPressed = event.keyCode;
                const goingUp = dy === -gridSize;
                const goingDown = dy === gridSize;
                const goingRight = dx === gridSize;
                const goingLeft = dx === -gridSize;

                // 防止掉頭撞到自己
                if (keyPressed === 37 && !goingRight) { dx = -gridSize; dy = 0; event.preventDefault(); }
                if (keyPressed === 38 && !goingDown) { dx = 0; dy = -gridSize; event.preventDefault(); }
                if (keyPressed === 39 && !goingLeft) { dx = gridSize; dy = 0; event.preventDefault(); }
                if (keyPressed === 40 && !goingUp) { dx = 0; dy = gridSize; event.preventDefault(); }
            }

            function update() {
                if (!gameActive) return;
                
                // 計算下一格頭部位置
                const head = { x: snake[0].x + dx, y: snake[0].y + dy };

                // 檢查是否撞牆
                if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                    gameOver(); 
                    return;
                }

                // 檢查是否撞到自己
                for (let i = 0; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        gameOver(); 
                        return;
                    }
                }

                // 把新頭部塞進陣列最前面
                snake.unshift(head);

                // 檢查是否吃到食物
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    scoreEl.innerText = score;
                    if (score > highScore) {
                        highScore = score;
                        highScoreEl.innerText = highScore;
                        localStorage.setItem("giraffe_high_score", highScore);
                    }
                    generateFood();
                } else {
                    snake.pop(); // 沒吃到就移除尾巴
                }
                
                draw();
            }

            function draw() {
                // 1. 鋪綠色草地
                ctx.fillStyle = "#aad46e";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 2. 畫綠色樹葉
                drawLeaf(food.x, food.y);
                
                // 3. 畫長頸鹿
                for (let i = 0; i < snake.length; i++) {
                    if (i === 0) {
                        drawGiraffeHead(snake[i].x, snake[i].y);
                    } else {
                        drawGiraffeBody(snake[i].x, snake[i].y, i);
                    }
                }
            }

            function drawGiraffeHead(x, y) {
                // 黃色頭部底色
                ctx.fillStyle = "#f5be41";
                ctx.fillRect(x, y, gridSize, gridSize);

                // 畫兩根深褐色小鹿角
                ctx.fillStyle = "#5c3a21";
                ctx.fillRect(x + 3, y - 4, 3, 4);
                ctx.fillRect(x + 14, y - 4, 3, 4);

                // 畫黑眼睛
                ctx.fillStyle = "#000000";
                ctx.fillRect(x + 12, y + 4, 3, 3);
                
                // 畫深色嘴巴嘴部區
                ctx.fillStyle = "#d4a373";
                ctx.fillRect(x + 8, y + 11, 10, 7);
            }

            function drawGiraffeBody(x, y, index) {
                // 黃色身體底色
                ctx.fillStyle = "#f5be41";
                ctx.fillRect(x, y, gridSize, gridSize);
                
                // 畫深褐色斑點
                ctx.fillStyle = "#b87314";
                if (index % 2 === 0) {
                    ctx.fillRect(x + 3, y + 3, 6, 6);
                    ctx.fillRect(x + 11, y + 11, 5, 5);
                } else {
                    ctx.fillRect(x + 11, y + 2, 6, 6);
                    ctx.fillRect(x + 2, y + 11, 6, 5);
                }
                
                // 加個細微邊框讓節點更明顯
                ctx.strokeStyle = "#99c25d";
                ctx.strokeRect(x, y, gridSize, gridSize);
            }

            function drawLeaf(x, y) {
                // 畫深綠色圓潤葉子
                ctx.fillStyle = "#2e7d32";
                ctx.beginPath();
                ctx.arc(x + 10, y + 10, 7, 0, Math.PI * 2);
                ctx.fill();
                
                // 咖啡色咖啡色小葉梗
                ctx.fillStyle = "#5c3a21";
                ctx.fillRect(x + 9, y + 15, 2, 4);
            }

            function gameOver() {
                gameActive = false;
                clearInterval(gameInterval);
                
                // 蓋上半透明咖啡色遮罩
                ctx.fillStyle = "rgba(74, 55, 40, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 24px Arial"; 
                ctx.textAlign = "center";
                ctx.fillText("遊戲結束 🦒", canvas.width / 2, canvas.height / 2 - 10);
                
                ctx.font = "16px Arial";
                ctx.fillText(`你讓長頸鹿長高了 ${score} 節！`, canvas.width / 2, canvas.height / 2 + 20);
                
                restartBtn.style.display = "inline-block";
            }

            restartBtn.addEventListener("click", startGame);
            
            // 真正啟動遊戲循環
            startGame();
        };
    </script>
</body>
</html>
